   name: Compilar APK

   on:
     push:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       defaults:
         run:
           working-directory: XSiguiendo
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 17
         - name: Compilar
           run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
         - uses: actions/upload-artifact@v4
           with:
             name: X-Siguiendo-APK
             path: XSiguiendo/app/build/outputs/apk/debug/app-debug.apk
